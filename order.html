<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-title">
          <span class="eyebrow">Order</span>
          <h2>สั่งซื้อสินค้า</h2>
        </div>

        <div class="form-wrap">
          <form id="orderForm">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required>

            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>

            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>

            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" required>

            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>

            <button type="submit">ยืนยันสั่งซื้อ</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; Body Scent</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
